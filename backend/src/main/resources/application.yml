spring:
  application:
    name: orcafin
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orcafin}
    username: ${DB_USER:orcafin}
    password: ${DB_PASSWORD:orcafin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-base64-string-in-production-please}
    expiration-ms: ${JWT_EXPIRATION_MS:259200000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2:1b}
  whisper:
    base-url: ${WHISPER_BASE_URL:http://localhost:9000}
