services:
  postgres:
    image: postgres:16-alpine
    container_name: orcafin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orcafin
      POSTGRES_USER: orcafin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orcafin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcafin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: orcafin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: orcafin
      DB_USER: orcafin
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
      SERVER_PORT: 8080
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      WHISPER_BASE_URL: http://whisper:9000
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OrçaFin Suporte}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: orcafin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"

  # Opcional: só sobe quando pedido explicitamente (profile "ai"), pra não consumir
  # RAM à toa numa máquina com 8GB. Ver README para como usar.
  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: orcafin-ollama
    restart: "no"
    profiles: ["ai"]
    environment:
      # Pula a tentativa de CUDA v13/Vulkan (cada uma tem seu próprio timeout de
      # descoberta) e vai direto pro CUDA v12 — pode convergir mais rápido dentro
      # da janela de detecção da GPU sob a virtualização do WSL2.
      OLLAMA_LLM_LIBRARY: cuda_v12
    volumes:
      - orcafin-ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Transcrição de áudio local (Whisper via faster-whisper), mesmo profile "ai".
  whisper:
    image: onerahmet/openai-whisper-asr-webservice@sha256:1132aa08c6eb9b440408864e8c25733d22a197ffea7c6975d60a4f4b6fd7b08b
    container_name: orcafin-whisper
    restart: "no"
    profiles: ["ai"]
    environment:
      ASR_MODEL: base
      ASR_ENGINE: faster_whisper
    volumes:
      - orcafin-whisper-data:/root/.cache
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Espelho/backup local do repositório (GitHub continua sendo o remoto principal).
  # Só acessível na própria máquina — não é pra ficar exposto na internet.
  gitea:
    image: gitea/gitea:1.22.6
    container_name: orcafin-gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3001/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__DISABLE_SSH: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - orcafin-gitea-data:/data
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:2222:22"

  # Bot do WhatsApp (whatsapp-web.js, não-oficial) — só sobe quando pedido
  # explicitamente. Usa um número secundário, nunca o principal (risco de
  # banimento por violar os Termos de Uso do WhatsApp, ver README).
  whatsapp-bot:
    build:
      context: ./whatsapp-bot
    container_name: orcafin-whatsapp-bot
    restart: unless-stopped
    profiles: ["whatsapp"]
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?defina INTERNAL_API_KEY no .env}
    volumes:
      - orcafin-whatsapp-session:/data/session

volumes:
  orcafin-postgres-data:
  orcafin-ollama-data:
  orcafin-whisper-data:
  orcafin-gitea-data:
  orcafin-whatsapp-session:
